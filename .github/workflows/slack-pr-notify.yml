name: Slack PR Notifications

on:
  pull_request_target:
    types: [review_requested, closed]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  notify:
    if: >-
      github.run_attempt == 1 &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      ((github.event.action == 'review_requested' && github.event.sender.type != 'Bot') ||
       (github.event.action == 'closed' && github.event.pull_request.merged == true) ||
       (github.event.action == 'submitted' &&
        (github.event.review.state == 'approved' || github.event.review.state == 'changes_requested')))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout trusted base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Send Slack notification
        uses: actions/github-script@v7
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_REVIEW_WEBHOOK_URL }}
        with:
          script: |
            const { notifySlack } = require('./.github/scripts/slack-notify.cjs')
            await notifySlack({ core, context, github, mode: 'pr' })
