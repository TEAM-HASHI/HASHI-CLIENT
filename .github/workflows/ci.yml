name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
  TURBO_SCM_HEAD: ${{ github.sha }}

jobs:
  quality:
    name: Quality & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect CI Scope
        id: ci-scope
        shell: bash
        run: .github/scripts/detect-ci-scope.sh "${TURBO_SCM_BASE}" "${TURBO_SCM_HEAD}" >> "${GITHUB_OUTPUT}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Test CI Scope Detection
        run: pnpm test:ci-scope

      - name: Format Check
        run: pnpm format:check

      - name: Lint
        run: pnpm turbo lint ${{ steps.ci-scope.outputs.turbo_args }}

      - name: Type Check
        run: pnpm turbo typecheck ${{ steps.ci-scope.outputs.turbo_args }}

      - name: Build
        run: pnpm turbo build ${{ steps.ci-scope.outputs.turbo_args }}

  test:
    name: Client & HDS Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect CI Scope
        id: ci-scope
        shell: bash
        run: .github/scripts/detect-ci-scope.sh "${TURBO_SCM_BASE}" "${TURBO_SCM_HEAD}" >> "${GITHUB_OUTPUT}"

      - name: Setup pnpm
        if: steps.ci-scope.outputs.run_tests == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.ci-scope.outputs.run_tests == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        if: steps.ci-scope.outputs.run_tests == 'true'
        run: pnpm install --frozen-lockfile

      - name: Test
        if: steps.ci-scope.outputs.run_tests == 'true'
        run: pnpm test
