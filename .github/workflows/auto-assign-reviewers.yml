name: Auto Assign Reviewers

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  assign-reviewers:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Assign reviewers
        id: assign
        uses: actions/github-script@v7
        with:
          script: |
            const { assignReviewers } = require('./.github/scripts/assign-reviewers.cjs')

            await assignReviewers({ core, context, github })

      - name: Notify Slack after reviewer assignment
        id: notify
        if: >-
          always() && !cancelled() && github.event.pull_request.user.type != 'Bot' &&
          (steps.assign.outcome == 'success' || steps.assign.outcome == 'failure')
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_REVIEW_WEBHOOK_URL }}
          ASSIGNMENT_RESULT: ${{ steps.assign.outcome }}
          NOTIFICATION_ATTEMPT: ${{ github.run_attempt }}
        with:
          script: |
            const { notifySlack } = require('./.github/scripts/slack-notify.cjs')
            const sent = await notifySlack({ core, context, github, mode: 'created',
              assignmentResult: process.env.ASSIGNMENT_RESULT,
              attempt: Number(process.env.NOTIFICATION_ATTEMPT),
            })
            core.setOutput('sent', sent)

      - name: Record successful PR notification
        if: always() && steps.assign.outcome == 'success' && steps.notify.outputs.sent == 'true'
        run: 'true'
